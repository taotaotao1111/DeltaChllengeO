<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 《物语千年》favicon：墨底 + 金「尊」，呼应站内 ink/gilt 色板与宋体标题 -->
  <rect width="100" height="100" rx="22" fill="#0a0a0c"/>
  <rect x="4" y="4" width="92" height="92" rx="19" fill="none" stroke="#a8863f" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
        font-family="'Songti SC','Noto Serif SC',STSong,serif" font-size="58"
        fill="#c9a76a">尊</text>
</svg>
